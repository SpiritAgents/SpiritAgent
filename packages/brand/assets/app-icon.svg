<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Packaging app icon (macOS ICNS / Windows ICO / icon.png), rasterized by apps/desktop/scripts/gen-brand-assets.mjs.
    Canvas stays square and opaque: macOS applies its own squircle mask; baking one here produces hard-cornered Dock tiles.

    Glyph path is duplicated from packages/brand/src/constants.js (static files cannot import it); update together.
    Glass layer stack mirrors src/spirit-glass-logo.jsx with the dark-mode CSS variables inlined (a static SVG has no
    var() consumers); fill alphas are raised (0.16 to 0.30, 0.04 to 0.08, main stroke 0.65 to 0.85 at 0.75 width)
    because at Dock size the glass detail otherwise disappears and the icon reads as a solid dark square next to
    neighbors (measured average luminance 5.5 vs 50-80 for adjacent icons in dark mode).

    Placement: the glyph is centered by its area centroid (45.13, 64.45 in viewBox units, computed numerically from
    the path), then pulled 50% back toward the bbox center. Pure bbox centering reads left-heavy (the tail is thin);
    pure centroid centering reads bottom-right-heavy (the arrow tip carries attention beyond its area).
    Background is pure #000000; the raised glyph alphas keep the icon from reading as a solid dark square at Dock sizes.
  -->
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <linearGradient id="app-icon-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#DCE6FF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="app-icon-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C8DCFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="app-icon-fresnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BED7FF" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#FFC8C8" stop-opacity="0.1"/>
      <stop offset="55%" stop-color="#C8FFD7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D7C8FF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="app-icon-blur-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="app-icon-blur-md" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g transform="translate(135.230,107.344) scale(2.08)">
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="url(#app-icon-fill)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="url(#app-icon-inner)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="url(#app-icon-fresnel)" stroke-width="3" opacity="0.25" filter="url(#app-icon-blur-md)"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.75" stroke-linejoin="round"/>
    <path d="M0 0L141.409 69.4512L70.7825 78.2408C61.5778 79.3863 53.5378 85.016 49.3132 93.2737L16.8979 156.635L0 0Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" filter="url(#app-icon-blur-sm)" opacity="0.5"/>
  </g>
</svg>
