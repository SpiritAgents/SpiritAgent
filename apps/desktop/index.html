<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spirit Agent</title>
    <script>
      (function () {
        if (!/\bElectron\//.test(navigator.userAgent)) return;
        var root = document.documentElement;
        root.classList.add("spirit-desktop-native", "spirit-launch-splash-active");
        var mica = true;
        try {
          if (window.spiritDesktop && window.spiritDesktop.readNativeBackdropBlur() === false) {
            mica = false;
          }
        } catch (_err) {}
        if (mica) root.classList.add("spirit-desktop-mica");
        var themeRaw = null;
        try {
          themeRaw = localStorage.getItem("spirit-agent-desktop-theme");
        } catch (_err2) {}
        var pref =
          themeRaw === "dark" || themeRaw === "light" || themeRaw === "system"
            ? themeRaw
            : "system";
        var osDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        try {
          if (window.spiritDesktop) {
            osDark = window.spiritDesktop.readOsPrefersDark();
          }
        } catch (_err3) {}
        var storedDark = pref === "dark" || (pref === "system" && osDark);
        if (storedDark) {
          root.classList.add("dark");
          root.dataset.spiritTheme = "dark";
        } else {
          root.dataset.spiritTheme = "light";
        }
      })();
    </script>
    <style>
      html.spirit-desktop-native.spirit-desktop-mica,
      html.spirit-desktop-native.spirit-desktop-mica body {
        background: transparent !important;
      }
      /* 关 Blur 时首帧临界底色：与 electronRootBackgroundForBackdrop / styles.css Void 对齐，须早于 module CSS */
      html.spirit-desktop-native:not(.spirit-desktop-mica),
      html.spirit-desktop-native:not(.spirit-desktop-mica) body {
        background-color: #fafafa;
      }
      html.spirit-desktop-native:not(.spirit-desktop-mica).dark,
      html.spirit-desktop-native:not(.spirit-desktop-mica).dark body {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
