appId: ai.spiritagent.desktop
productName: Spirit Agent
icon: build/icon.ico
artifactName: SpiritAgent-Desktop-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - package.json
  - .env
  - dist/**/*
  - dist-electron/**/*
  - build/tray/**/*
  - node_modules/**/*
  - "!**/target/**/*"
  - from: node_modules/@vscode
    to: node_modules/@vscode
    filter:
      - ripgrep/**
      - ripgrep-*/**
  - ../../packages/agent-core/dist/**/*
  - ../../packages/agent-core/package.json
  - ../../packages/host-internal/dist/**/*
  - ../../packages/host-internal/package.json
  - ../../packages/server/dist/**/*
  - ../../packages/server/package.json
extraMetadata:
  main: dist-electron/electron/main.js
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/koffi/**/*
  - node_modules/@napi-rs/keyring/**/*
  - node_modules/@vscode/ripgrep/**/*
  - node_modules/@vscode/ripgrep-*/**/*
npmRebuild: true
buildDependenciesFromSource: false
publish: null
win:
  target:
    - nsis
    - zip
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  # Prefer darwin over electron-builder's default ${os}=mac for release URL alignment.
  artifactName: SpiritAgent-Desktop-${version}-darwin-${arch}.${ext}
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  # Helper processes need the same JIT entitlements as the main app; one plist covers both.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs as its own CI job against the finished dmg/zip: bundling it here ties a
  # 35-minute Apple round trip to the build, so one network blip discards the signed output too.
  notarize: false
dmg:
  # build/ 下的 background.png / background@2x.png 会被 dmg-builder 自动采用，窗口尺寸跟随图片（540x408）。
  # 注意：DMG 窗口高度包含 Finder 标题栏（约 28pt），内容区只有 380pt，背景图底部 28pt 会被裁掉。
  # 因此背景图底部特意留 28px 白边，使烤进背景的箭头与下方图标（y=190）落在内容区视觉中心；
  # 后续改设计稿时必须保留这段底部留白，否则整体会视觉偏下。
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications
linux:
  maintainer: Spirit Agent contributors <121384036+N123999@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: Development
