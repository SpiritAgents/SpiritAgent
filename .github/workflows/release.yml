# Manual release pipeline: build HEAD → prepare report → single environment:release publish → tag X.Y.Z.
# Configure GitHub Environment "release" with Required reviewers (and Cloudflare secrets) before publishing.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (pure X.Y.Z, for example 0.1.0)'
        required: true
        type: string
permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version }}
  NODE_VERSION: '22'
  SPIRIT_RELEASE_NODE_MAJOR: '22'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Require Desktop GitHub OAuth Client ID secret
        run: |
          if [ -z "${{ secrets.SPIRIT_GITHUB_OAUTH_CLIENT_ID }}" ]; then
            echo "::error::Repository secret SPIRIT_GITHUB_OAUTH_CLIENT_ID is required for Desktop release."
            exit 1
          fi

      - name: Verify versions
        run: npm run release:verify-version -- --version "$RELEASE_VERSION"

  cli:
    name: CLI ${{ matrix.package_target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            package_target: windows-x64
            builder: cargo
          - os: windows-latest
            rust_target: i686-pc-windows-msvc
            package_target: windows-ia32
            builder: cargo
          - os: windows-latest
            rust_target: aarch64-pc-windows-msvc
            package_target: windows-arm64
            builder: cargo
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            package_target: linux-x64
            builder: cargo
          - os: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            package_target: linux-arm64
            builder: cross
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            package_target: darwin-x64
            builder: cargo
          - os: macos-14
            rust_target: aarch64-apple-darwin
            package_target: darwin-arm64
            builder: cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript runtime
        run: npm run build:agent-core && npm run build:host-internal

      - name: Setup Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build CLI
        if: matrix.builder == 'cargo'
        run: cargo build -p spirit-agent --release --target ${{ matrix.rust_target }}

      - name: Build CLI with cross
        if: matrix.builder == 'cross'
        run: cross build -p spirit-agent --release --target ${{ matrix.rust_target }}

      - name: Bundle CLI
        run: npm run release:cli:bundle -- --target ${{ matrix.rust_target }} --version "$RELEASE_VERSION"
        shell: bash

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.package_target }}
          path: dist/release/SpiritAgent-CLI-*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.package_target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    env:
      SPIRIT_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.SPIRIT_GITHUB_OAUTH_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            package_target: windows-x64
          - os: windows-latest
            platform: win
            arch: ia32
            package_target: windows-ia32
          - os: windows-latest
            platform: win
            arch: arm64
            package_target: windows-arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            package_target: linux-x64
          - os: ubuntu-24.04
            platform: linux
            arch: arm64
            package_target: linux-arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
            package_target: darwin-x64
          - os: macos-14
            platform: mac
            arch: arm64
            package_target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/desktop

      - name: Build Desktop
        run: npm --prefix apps/desktop run build

      - name: Verify packager icons
        working-directory: apps/desktop
        run: npm run gen:icons

      - name: Package Desktop
        working-directory: apps/desktop
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.package_target }}
          # electron-builder leaves *-unpacked dirs when packaging Linux; exclude them.
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error

  # prepare builds the English approval summary (changelog + per-channel asset tables).
  prepare:
    name: Prepare approval report
    needs:
      - cli
      - desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare approval report
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run release:prepare-approval-report -- \
            --input release-assets \
            --output-dir release-assets/approval \
            --version "$RELEASE_VERSION" \
            --sha "${{ github.sha }}"

      - name: Write job summary
        run: cat release-assets/approval/approval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/
          if-no-files-found: error

  # Single approval gate: Environment "release" (Required reviewers + Cloudflare secrets).
  # After approval, publish GitHub Release, npm packages, and self-hosted CDN objects.
  publish:
    name: Publish release channels
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      SPIRIT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SPIRIT_CLOUDFLARE_ACCOUNT_ID }}
      SPIRIT_CLOUDFLARE_API_TOKEN: ${{ secrets.SPIRIT_CLOUDFLARE_API_TOKEN }}
      SPIRIT_CLOUDFLARE_BUCKET_NAME: ${{ secrets.SPIRIT_CLOUDFLARE_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-assets

      - name: Show approval report
        run: |
          echo "Review the English approval report in the prepare job summary before approving this environment deployment."
          echo
          cat release-assets/approval/approval-report.md >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/approval/approval-report.md

      - name: Require Cloudflare secrets
        run: |
          if [ -z "$SPIRIT_CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SPIRIT_CLOUDFLARE_API_TOKEN" ] || [ -z "$SPIRIT_CLOUDFLARE_BUCKET_NAME" ]; then
            echo "::error::Environment secrets SPIRIT_CLOUDFLARE_ACCOUNT_ID, SPIRIT_CLOUDFLARE_API_TOKEN, and SPIRIT_CLOUDFLARE_BUCKET_NAME are required."
            exit 1
          fi

      # Self-hosted first: R2 failures must not leave GitHub Release / npm already public.
      - name: Publish self-hosted downloads
        run: |
          npm run release:publish-selfhosted -- \
            --input release-assets \
            --version "$RELEASE_VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub Release $RELEASE_VERSION already exists; refusing to overwrite."
            exit 1
          fi
          mapfile -d '' -t assets < <(find release-assets -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under release-assets" >&2
            exit 1
          fi
          notes_file="release-assets/approval/release-notes.md"
          if [ ! -f "$notes_file" ]; then
            echo "Missing approval release notes: $notes_file" >&2
            exit 1
          fi
          # Tag name is the pure version X.Y.Z (no "v" prefix).
          gh release create "$RELEASE_VERSION" "${assets[@]}" \
            --title "$RELEASE_VERSION" \
            --target "${{ github.sha }}" \
            --notes-file "$notes_file"

      - name: Install dependencies for npm publish
        run: npm ci

      - name: Publish npm packages
        run: |
          set -euo pipefail
          # Dependency order: agent-core → host-internal → acp-server
          # npm Trusted Publishing: Environment name on npm must stay empty (OIDC matches workflow file).
          npm --prefix packages/agent-core publish --access public
          npm --prefix packages/host-internal publish --access public
          npm --prefix packages/acp-server publish --access public

  # After publish finishes, ensure archival tag X.Y.Z points at the built SHA.
  finalize-tag:
    name: Finalize release tag
    needs:
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag at release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_VERSION"
          EXPECTED_SHA="${{ github.sha }}"

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null || true

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            ACTUAL_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::Tag ${TAG} points to ${ACTUAL_SHA}, expected ${EXPECTED_SHA}"
              exit 1
            fi
            echo "Tag ${TAG} already points at ${EXPECTED_SHA}"
          else
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed tag ${TAG} at ${EXPECTED_SHA}"
          fi
