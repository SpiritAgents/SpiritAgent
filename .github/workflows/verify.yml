# Build-check all packages and apps on every branch push.
name: Verify

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build packages and apps
    runs-on: ubuntu-latest
    env:
      SPIRIT_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.SPIRIT_GITHUB_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Require Desktop GitHub OAuth Client ID secret
        run: |
          if [ -z "${{ secrets.SPIRIT_GITHUB_OAUTH_CLIENT_ID }}" ]; then
            echo "::error::Repository secret SPIRIT_GITHUB_OAUTH_CLIENT_ID is required for Desktop build."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages, Desktop, and site
        run: pnpm turbo run build

      - name: Lint TypeScript (Oxlint)
        run: pnpm exec oxlint --deny-warnings packages apps/desktop apps/site

      - name: Check TypeScript formatting (Oxfmt)
        run: pnpm exec oxfmt --check packages apps/desktop apps/site

      - name: Build CLI
        run: cargo build -p spirit-agent

      - name: Clippy CLI (deny warnings)
        run: cargo clippy --all-targets -p spirit-agent -- -D warnings

      - name: Test CLI
        run: cargo test -p spirit-agent
